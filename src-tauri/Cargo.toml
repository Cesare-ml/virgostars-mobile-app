[package]
name = "virgostars-mobile"
version = "0.1.0"
description = "Experimental Android-first VirgoStars mobile shell"
authors = ["VirgoStars project"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "virgostars_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
swiss-ephemeris = ["dep:sweph-sys"]
de441-native-probe = ["dep:virgostars-ephemeris-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sweph-sys = { version = "=0.3.0", optional = true }
serde_json = "1"
sha2 = "0.10"
base64 = "0.23"
virgostars-ephemeris-core = { git = "https://github.com/Cesare-ml/VirgoStars-Ephemeris", rev = "996b0056aad4207c7b748b837c5440eb587e382b", optional = true }

[dev-dependencies]
