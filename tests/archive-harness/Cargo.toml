[package]
name = "virgostars-mobile-archive-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "=0.10.1"
rusqlite = { version = "=0.32.1", features = ["bundled", "serialize"] }
zeroize = "=1.9.2"
subtle = "=2.6.1"
url = "2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "=1.0.12"
getrandom = "=0.3.4"
serde_json = "1"
tauri = { path = "tauri-stub" }
